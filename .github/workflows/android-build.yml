name: 일감장부 APK 빌드

on:
  push:
    branches:
      - main
      - "claude/**"
    paths:
      - "android/**"
      - ".github/workflows/android-build.yml"
  pull_request:
    paths:
      - "android/**"
  # 깃허브 화면에서 직접 눌러 빌드할 수 있게 합니다.
  workflow_dispatch:

jobs:
  build:
    name: 디버그 APK 만들기
    runs-on: ubuntu-latest

    steps:
      - name: 소스 내려받기
        uses: actions/checkout@v4

      - name: 자바(JDK 17) 준비
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 안드로이드 SDK 준비
        uses: android-actions/setup-android@v3

      # gradle 실행기를 직접 설치해 씁니다(저장소에 wrapper 바이너리를 두지 않기 위함).
      - name: Gradle 준비
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: 디버그 APK 빌드
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: APK 올리기
        uses: actions/upload-artifact@v4
        with:
          name: ilgam-jangbu-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
